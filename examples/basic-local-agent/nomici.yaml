version: "0.1"
project:
  name: basic-local-agent
  description: Minimal local command-backed agent example.
runtimes:
  local_echo:
    kind: cli_agent
    runner: cli_invoke
    workspace: ./workspace
    capabilities:
      files_write: false
    invoke:
      executable: sh
      args:
        - -c
        - |
          printf "Basic local agent received:\n%s\n" "$1"
        - basic-local-agent
        - "${INPUT}"
agents:
  local_assistant:
    kind: external_agent
    runtime: local_echo
    role: Echo the task through a local command so new users can verify the control-plane path.
