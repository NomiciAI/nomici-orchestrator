name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret pattern scan
        run: |
          if grep -R --exclude-dir=dist --exclude-dir=node_modules -n -E '(sk-[A-Za-z0-9]{10,}|api_key:\s|password:\s|secret:\s|BEGIN (RSA|OPENSSH|PRIVATE) KEY|Authorization: Bearer [A-Za-z0-9]{10,})' README.md CHANGELOG.md docs .github SECURITY.md internal cmd apps packages scripts examples 2>/dev/null; then
            echo "Potential secret-like content found. Review and redact before merging."
            exit 1
          fi

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Build
        run: make build
